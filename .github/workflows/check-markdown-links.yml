name: 'Check Markdown Links'

on:
  pull_request:
    paths:
      - "**/*.md"

permissions:
  pull-requests: read

jobs:
  check-markdown-links:
    # https://github.com/UmbrellaDocs/action-linkspector/issues/32
    # Upgrade to `ubuntu-latest` when resolved
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check markdown links
        uses: umbrelladocs/action-linkspector@568ec8d29fa92b31fd9ea5381e155c51e922af83 # v1.5.5
        with:
          config_file: .github/linters/.linkspector.yml
          fail_on_error: true
          filter_mode: nofilter
